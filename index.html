<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shell Squad — Открытый набор на 3 ЛВЛ</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; }
        body { min-height: 100vh; color: #f1f5f9; background: #0d131a; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; overflow-x: hidden; position: relative; }
        
        /* Фон с параллаксом */
        .bg-layer { position: fixed; inset: -20px; background-image: linear-gradient(to bottom, rgba(13,19,26,0.35), rgba(10,14,20,0.85)), url('bg.jpg'), url('https://unsplash.com'); background-size: cover; background-position: center; z-index: 0; pointer-events: none; transition: transform 0.2s ease-out; }
        
        /* Птицы и светлячки */
        .sky-birds { position: fixed; top: 0; left: 0; width: 100%; height: 60%; pointer-events: none; z-index: 1; overflow: hidden; }
        .bird-box { position: absolute; left: -10%; animation: fly linear infinite; opacity: 0.65; }
        .bird { width: 24px; height: 12px; fill: none; stroke: rgba(203,213,225,0.75); stroke-width: 2; stroke-linecap: round; animation: flap 0.8s ease-in-out infinite alternate; }
        @keyframes fly { 0% { transform: translate(0, 0) scale(0.8); } 50% { transform: translate(60vw, -25px) scale(1); } 100% { transform: translate(120vw, 10px) scale(0.7); } }
        @keyframes flap { 0% { transform: scaleY(1); } 100% { transform: scaleY(-0.6); } }
        
        .fireflies { position: fixed; inset: 0; pointer-events: none; z-index: 2; }
        .firefly { position: absolute; width: 4px; height: 4px; background: #c4b5fd; border-radius: 50%; box-shadow: 0 0 10px 2px rgba(167,139,250,0.8); animation: floatF ease-in-out infinite; opacity: 0; }
        @keyframes floatF { 0%, 100% { transform: translate(0, 0); opacity: 0; } 50% { transform: translate(25px, -60px); opacity: 0.85; } }

        /* Верхняя панель навигации */
        .top-nav { position: fixed; top: 20px; right: 24px; z-index: 50; display: flex; gap: 10px; align-items: center; }
        .nav-btn { background: rgba(18, 24, 34, 0.72); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.16); color: #f1f5f9; padding: 10px 18px; border-radius: 12px; font-size: 13px; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .nav-btn:hover { background: rgba(139, 92, 246, 0.3); border-color: rgba(167, 139, 250, 0.5); }
        .nav-btn.accent { background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%); border: none; }
        .nav-btn.accent:hover { opacity: 0.9; transform: translateY(-1px); }

        /* Контент */
        .main-wrapper { position: relative; z-index: 10; width: 100%; display: flex; flex-direction: column; align-items: center; }
        .hero-box { text-align: center; max-width: 600px; animation: fadeIn 0.45s ease-out; }
        .glass-card { background: rgba(18, 24, 34, 0.78); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.14); border-radius: 24px; padding: 36px; width: 100%; max-width: 480px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.85); animation: fadeIn 0.35s ease-out; }
        .admin-wide { max-width: 720px; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

        .tag { display: inline-block; padding: 6px 16px; background: rgba(16, 185, 129, 0.16); border: 1px solid rgba(16, 185, 129, 0.4); color: #6ee7b7; border-radius: 99px; font-size: 12px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 16px; }
        h1.main-title { font-size: 54px; font-weight: 800; letter-spacing: -1px; margin-bottom: 14px; background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; cursor: pointer; }
        p.hero-desc { color: #e2e8f0; font-size: 16px; line-height: 1.6; margin-bottom: 32px; text-shadow: 0 2px 10px rgba(0,0,0,0.8); }

        .btn-glow { background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%); color: #fff; border: none; padding: 18px 38px; font-size: 17px; font-weight: 600; border-radius: 16px; cursor: pointer; box-shadow: 0 10px 30px rgba(139, 92, 246, 0.45); transition: 0.2s; }
        .btn-glow:hover { transform: translateY(-3px) scale(1.03); box-shadow: 0 15px 40px rgba(139, 92, 246, 0.7); }

        h2 { font-size: 24px; margin-bottom: 8px; font-weight: 700; }
        .sub { color: #94a3b8; font-size: 14px; margin-bottom: 20px; }
        .input-group { margin-bottom: 14px; text-align: left; }
        label { display: block; font-size: 13px; color: #cbd5e1; margin-bottom: 6px; font-weight: 500; }
        input, textarea { width: 100%; background: rgba(10, 15, 22, 0.85); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 12px; padding: 12px 14px; color: #fff; font-size: 14px; }
        input:focus, textarea:focus { outline: none; border-color: #8b5cf6; }
        textarea { resize: vertical; min-height: 75px; }

        .btn-submit { width: 100%; background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%); color: #fff; border: none; padding: 14px; border-radius: 12px; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 8px; }
        .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; }
        .switch-link { margin-top: 14px; text-align: center; font-size: 13px; color: #94a3b8; }
        .switch-link span { color: #a78bfa; cursor: pointer; text-decoration: underline; }

        .status-box { padding: 22px; border-radius: 16px; background: rgba(15, 23, 42, 0.8); border: 1px solid rgba(255, 255, 255, 0.12); text-align: center; }
        .status-badge { display: inline-block; padding: 6px 14px; border-radius: 10px; font-weight: 700; font-size: 14px; margin-bottom: 12px; }
        .st-wait { background: rgba(234, 179, 8, 0.15); color: #facc15; border: 1px solid rgba(234, 179, 8, 0.3); }
        .st-review { background: rgba(59, 130, 246, 0.15); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.3); }
        .st-accept { background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }
        .st-reject { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }

        .app-item { background: rgba(10, 15, 22, 0.88); border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 14px; padding: 18px; margin-bottom: 14px; text-align: left; }
        .app-item p { font-size: 13px; color: #cbd5e1; margin-bottom: 6px; line-height: 1.4; }
        .app-actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
        .act-btn { border: none; padding: 8px 14px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; color: #fff; }
        .btn-take { background: #3b82f6; } .btn-yes { background: #10b981; } .btn-no { background: #ef4444; }
        .hidden { display: none !important; }
        .footer-admin { position: fixed; bottom: 12px; right: 16px; z-index: 15; font-size: 12px; color: rgba(255,255,255,0.35); cursor: pointer; }
        .footer-admin:hover { color: rgba(255,255,255,0.85); }
    </style>
</head>
<body>

<div class="bg-layer" id="bgLayer"></div>
<div class="sky-birds" id="skyBirds"></div>
<div class="fireflies" id="fireflies"></div>

<!-- ПРАВЫЙ ВЕРХНИЙ УГОЛ: ВХОД / РЕГИСТРАЦИЯ -->
<div class="top-nav" id="navGuest">
    <button type="button" class="nav-btn" onclick="goTo('screen-login')">Войти</button>
    <button type="button" class="nav-btn accent" onclick="goTo('screen-register')">Регистрация</button>
</div>
<div class="top-nav hidden" id="navUser">
    <button type="button" class="nav-btn" onclick="checkUserNextStep()" id="navUserNick">Профиль</button>
    <button type="button" class="nav-btn" onclick="logoutUser()">Выйти</button>
</div>

<div class="main-wrapper">
    <!-- ГЛАВНЫЙ ЭКРАН -->
    <div id="screen-home" class="hero-box">
        <div class="tag">SHELL SQUAD • ОТКРЫТЫЙ НАБОР</div>
        <h1 class="main-title" onclick="goTo('screen-home')">Shell Squad</h1>
        <p class="hero-desc">Атмосфера, опыт и комьюнити. Пройди отбор и получи доступ к приватному 3 уровню.</p>
        <button type="button" class="btn-glow" onclick="startFlow()">Подать заявку на 3 лвл →</button>
    </div>

    <!-- РЕГИСТРАЦИЯ -->
    <div id="screen-register" class="glass-card hidden">
        <h2>Регистрация</h2>
        <p class="sub">Создайте аккаунт, чтобы подать анкету и отслеживать статус.</p>
        <form onsubmit="handleRegister(event)">
            <div class="input-group"><label>Придумайте логин (Никнейм)</label><input type="text" id="reg-login" placeholder="Например: Shadow" required></div>
            <div class="input-group"><label>Придумайте пароль</label><input type="password" id="reg-pass" placeholder="••••••••" required></div>
            <button type="submit" class="btn-submit" id="reg-btn">Зарегистрироваться</button>
        </form>
        <div class="switch-link">Уже есть аккаунт? <span onclick="goTo('screen-login')">Войти</span></div>
    </div>

    <!-- ВХОД В АККАУНТ -->
    <div id="screen-login" class="glass-card hidden">
        <h2>Вход в аккаунт</h2>
        <p class="sub">Войдите, чтобы проверить статус вашей заявки.</p>
        <form onsubmit="handleLogin(event)">
            <div class="input-group"><label>Ваш логин (Никнейм)</label><input type="text" id="log-login" placeholder="Введите логин" required></div>
            <div class="input-group"><label>Ваш пароль</label><input type="password" id="log-pass" placeholder="••••••••" required></div>
            <button type="submit" class="btn-submit" id="log-btn">Войти</button>
        </form>
