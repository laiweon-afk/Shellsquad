<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shell Squad — Открытый набор на 3 ЛВЛ</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
body { min-height: 100vh; color: #f1f5f9; background: #0d131a; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; overflow: hidden; position: relative; }
.bg-layer { position: fixed; inset: -20px; background-image: linear-gradient(to bottom, rgba(13,19,26,0.35), rgba(10,14,20,0.92)), url('bg.jpg'), url('https://unsplash.com'); background-size: cover; background-position: center; z-index: 0; pointer-events: none; }
.sky-birds { position: fixed; top: 0; left: 0; width: 100%; height: 60%; pointer-events: none; z-index: 1; }
.bird-box { position: absolute; left: -10%; animation: fly linear infinite; opacity: 0.65; }
.bird { width: 24px; height: 12px; fill: none; stroke: rgba(203,213,225,0.75); stroke-width: 2; stroke-linecap: round; animation: flap 0.8s ease-in-out infinite alternate; }
@keyframes fly { 0% { transform: translate(0, 0) scale(0.8); } 50% { transform: translate(60vw, -25px) scale(1); } 100% { transform: translate(120vw, 10px) scale(0.7); } }
@keyframes flap { 0% { transform: scaleY(1); } 100% { transform: scaleY(-0.6); } }
header { position: fixed; top: 0; left: 0; right: 0; z-index: 50; padding: 18px 32px; display: flex; justify-content: space-between; align-items: center; background: linear-gradient(to bottom, rgba(10,14,20,0.85), transparent); }
.logo { font-size: 20px; font-weight: 800; color: #fff; text-decoration: none; }
.nav-links { display: flex; gap: 10px; }
.nav-btn { text-decoration: none; background: rgba(18,24,34,0.82); border: 1px solid rgba(255,255,255,0.18); color: #f1f5f9; padding: 9px 18px; border-radius: 12px; font-size: 13px; font-weight: 600; transition: 0.2s; }
.nav-btn:hover { background: rgba(139,92,246,0.35); }
.nav-btn.accent { background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%); border: none; }
.hero-box { position: relative; z-index: 10; text-align: center; max-width: 580px; }
.tag { display: inline-block; padding: 6px 16px; background: rgba(16,185,129,0.16); border: 1px solid rgba(16,185,129,0.4); color: #6ee7b7; border-radius: 99px; font-size: 12px; font-weight: 700; margin-bottom: 16px; }
h1 { font-size: 56px; font-weight: 800; margin-bottom: 14px; background: linear-gradient(135deg, #fff 0%, #cbd5e1 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
p { color: #e2e8f0; font-size: 16px; line-height: 1.6; margin-bottom: 34px; }
.btn-glow { text-decoration: none; display: inline-block; background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%); color: #fff; padding: 18px 38px; font-size: 17px; font-weight: 600; border-radius: 16px; box-shadow: 0 10px 30px rgba(139,92,246,0.45); transition: 0.2s; }
.btn-glow:hover { transform: translateY(-3px) scale(1.03); box-shadow: 0 15px 40px rgba(139,92,246,0.7); }
footer { position: fixed; bottom: 12px; left: 0; right: 0; z-index: 15; text-align: center; color: #64748b; font-size: 12px; }
footer a { color: #94a3b8; text-decoration: none; }
</style>
</head>
<body>
<div class="bg-layer"></div>
<div class="sky-birds" id="skyBirds"></div>
<header>
  <a href="index.html" class="logo">Shell Squad</a>
  <div class="nav-links">
    <a href="app.html?mode=login" class="nav-btn">Войти</a>
    <a href="app.html?mode=register" class="nav-btn accent">Регистрация</a>
  </div>
</header>
<div class="hero-box">
  <div class="tag">SHELL SQUAD • ОТКРЫТЫЙ НАБОР</div>
  <h1>Shell Squad</h1>
  <p>Атмосфера, опыт и комьюнити. Пройди отбор и получи доступ к приватному 3 уровню.</p>
  <a href="app.html" class="btn-glow">Подать заявку на 3 лвл →</a>
</div>
<footer>Shell Squad © 2026 • <a href="app.html?mode=admin">Панель администрации</a></footer>
<script>
for (let i = 0; i < 6; i++) {
  const b = document.createElement('div');
  b.className = 'bird-box';
  b.style.top = (12 + Math.random() * 28) + '%';
  b.style.animationDuration = (16 + Math.random() * 14) + 's';
  b.style.animationDelay = (-Math.random() * 20) + 's';
  b.innerHTML = '<svg class="bird" viewBox="0 0 24 12"><path d="M2 8 Q7 2 12 8 Q17 2 22 8"/></svg>';
  document.getElementById('skyBirds').appendChild(b);
}
</script>
</body>
</html>
