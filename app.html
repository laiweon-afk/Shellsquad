<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shell Squad — Открытый набор на 3 ЛВЛ</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Roboto,sans-serif}
body{min-height:100vh;color:#f1f5f9;background:#0d131a;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:20px;overflow:hidden;position:relative}
.bg-layer{position:fixed;inset:-20px;background:linear-gradient(to bottom,rgba(13,19,26,.35),rgba(10,14,20,.92)),url('bg.jpg'),url('https://unsplash.com');background-size:cover;background-position:center;z-index:0;pointer-events:none}
.sky-birds{position:fixed;top:0;left:0;width:100%;height:60%;pointer-events:none;z-index:1}
.bird-box{position:absolute;left:-10%;animation:fly linear infinite;opacity:.65}
.bird{width:24px;height:12px;fill:none;stroke:rgba(203,213,225,.75);stroke-width:2;stroke-linecap:round;animation:flap .8s ease-in-out infinite alternate}
@keyframes fly{0%{transform:translate(0,0) scale(.8)}50%{transform:translate(60vw,-25px) scale(1)}100%{transform:translate(120vw,10px) scale(.7)}}
@keyframes flap{0%{transform:scaleY(1)}100%{transform:scaleY(-.6)}}
header{position:fixed;top:0;left:0;right:0;z-index:50;padding:18px 32px;display:flex;justify-content:space-between;align-items:center;background:linear-gradient(to bottom,rgba(10,14,20,.85),transparent)}
.logo{font-size:20px;font-weight:800;color:#fff;text-decoration:none}
.nav-links{display:flex;gap:10px;align-items:center}
.nav-btn{text-decoration:none;background:rgba(18,24,34,.82);border:1px solid rgba(255,255,255,.18);color:#f1f5f9;padding:9px 18px;border-radius:12px;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:.2s}
.nav-btn:hover{background:rgba(139,92,246,.35)}
.nav-btn.accent{background:linear-gradient(135deg,#6366f1 0%,#8b5cf6 100%);border:none}
.dot{width:8px;height:8px;border-radius:50%;background:#34d399;box-shadow:0 0 8px #34d399}
.hero-box{position:relative;z-index:10;text-align:center;max-width:580px}
.tag{display:inline-block;padding:6px 16px;background:rgba(16,185,129,.16);border:1px solid rgba(16,185,129,.4);color:#6ee7b7;border-radius:99px;font-size:12px;font-weight:700;margin-bottom:16px}
h1{font-size:56px;font-weight:800;margin-bottom:14px;background:linear-gradient(135deg,#fff 0%,#cbd5e1 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
p{color:#e2e8f0;font-size:16px;line-height:1.6;margin-bottom:34px}
.btn-glow{text-decoration:none;display:inline-block;background:linear-gradient(135deg,#6366f1 0%,#8b5cf6 100%);color:#fff;padding:18px 38px;font-size:17px;font-weight:600;border-radius:16px;box-shadow:0 10px 30px rgba(139,92,246,.45);transition:.2s}
.btn-glow:hover{transform:translateY(-3px) scale(1.03);box-shadow:0 15px 40px rgba(139,92,246,.7)}
.hidden{display:none!important}
footer{position:fixed;bottom:12px;left:0;right:0;z-index:15;text-align:center;color:#64748b;font-size:12px}
footer a{color:#94a3b8;text-decoration:none}
</style>
</head>
<body>
<div class="bg-layer"></div>
<div class="sky-birds" id="skyBirds"></div>
<header>
  <a href="index.html" class="logo">Shell Squad</a>
  <div class="nav-links" id="gNav">
    <a href="app.html?mode=login" class="nav-btn">Войти</a>
    <a href="app.html?mode=register" class="nav-btn accent">Регистрация</a>
  </div>
  <div class="nav-links hidden" id="uNav">
    <a href="app.html?mode=profile" class="nav-btn"><span class="dot"></span> <span id="uName">Профиль</span></a>
    <button type="button" class="nav-btn" onclick="logoutHome()">Выйти</button>
  </div>
</header>
<div class="hero-box">
  <div class="tag">SHELL SQUAD • ОТКРЫТЫЙ НАБОР</div>
  <h1>Shell Squad</h1>
  <p id="hSub">Атмосфера, опыт и комьюнити. Пройди отбор и получи доступ к приватному 3 уровню.</p>
  <a href="app.html" class="btn-glow" id="hBtn">Подать заявку на 3 лвл →</a>
</div>
<footer>Shell Squad © 2026 • <a href="app.html?mode=admin">Панель администрации</a></footer>
<script>
const DB = 'https://' + '://firebaseio.com';
for(let i=0;i<6;i++){const b=document.createElement('div');b.className='bird-box';b.style.top=(12+Math.random()*28)+'%';b.style.animationDuration=(16+Math.random()*14)+'s';b.style.animationDelay=(-Math.random()*20)+'s';b.innerHTML='<svg class="bird" viewBox="0 0 24 12"><path d="M2 8 Q7 2 12 8 Q17 2 22 8"/></svg>';document.getElementById('skyBirds').appendChild(b)}

function renderHomeUser(){
  const nick=localStorage.getItem('s_nick');
  const app=localStorage.getItem('s_app');
  if(nick){
    document.getElementById('gNav').classList.add('hidden');
    document.getElementById('uNav').classList.remove('hidden');
    document.getElementById('uName').textContent=nick;
    document.getElementById('hSub').innerHTML='Добро пожаловать, <strong style="color:#fff">'+nick+'</strong>! Ваш аккаунт синхронизирован.';
    document.getElementById('hBtn').textContent=app?'Статус моей заявки →':'Подать заявку на 3 лвл →';
  }else{
    document.getElementById('gNav').classList.remove('hidden');
    document.getElementById('uNav').classList.add('hidden');
    document.getElementById('hSub').textContent='Атмосфера, опыт и комьюнити. Пройди отбор и получи доступ к приватному 3 уровню.';
    document.getElementById('hBtn').textContent='Подать заявку на 3 лвл →';
  }
}

async function syncHome(){
  renderHomeUser();
  const k=localStorage.getItem('s_key');
  if(!k)return;
  try{
    const r=await fetch(DB+'/users/'+k+'.json');
    if(!r.ok)return;
    const u=await r.json();
    if(u){
      localStorage.setItem('s_nick',u.displayNick||u.login);
      if(u.appId)localStorage.setItem('s_app',u.appId);else localStorage.removeItem('s_app');
      renderHomeUser();
    }else{logoutHome()}
  }catch(e){}
}

function logoutHome(){localStorage.clear();renderHomeUser()}
window.addEventListener('DOMContentLoaded',syncHome);
</script>
</body>
</html>
<script>
const DB = 'https://' + '://firebaseio.com';
const HOOK = 'https://' + '://discord.com';
const PASS = 'shell2026';
let tmr = null;

function keyOf(s){return Array.from(s.trim().toLowerCase()).map(c=>c.charCodeAt(0).toString(16)).join('')}
function show(id){document.querySelectorAll('.card').forEach(e=>e.classList.add('hidden'));document.getElementById(id).classList.remove('hidden')}
function backP(){show(localStorage.getItem('s_app')?'b-st':'b-app')}

async function init(){
  const m=new URLSearchParams(location.search).get('mode');
  if(m==='admin'){show('b-adm');return}
  const k=localStorage.getItem('s_key');
  if(k){
    try{
      const r=await fetch(DB+'/users/'+k+'.json');
      if(r.ok){
        const u=await r.json();
        if(u){
          localStorage.setItem('s_nick',u.displayNick||u.login);
          localStorage.setItem('s_login',u.login);
          localStorage.setItem('s_ds',u.discord||'');
          if(u.appId)localStorage.setItem('s_app',u.appId);else localStorage.removeItem('s_app');
          ui();
          if(u.appId)watch(u.appId);
          if(m==='profile'){show('b-prof');return}
          show(u.appId?'b-st':'b-app');
          return;
        }
      }
    }catch(e){}
    if(localStorage.getItem('s_nick')){
      ui();
      const app=localStorage.getItem('s_app');
      if(app)watch(app);
      if(m==='profile'){show('b-prof');return}
      show(app?'b-st':'b-app');
      return;
    }
  }
  show(m==='login'?'b-log':'b-reg');
}

function ui(){
  const n=localStorage.getItem('s_nick'),l=localStorage.getItem('s_login')||n,d=localStorage.getItem('s_ds')||'';
  document.getElementById('navU').classList.remove('hidden');
  document.getElementById('uNick').textContent=n;
  document.getElementById('p-log-inp').value=l;
  document.getElementById('p-nick').value=n;
  document.getElementById('p-ds').value=d;
  document.getElementById('a-user').textContent=n;
  document.getElementById('st-user').textContent=n;
  if(d&&!document.getElementById('f-ds').value)document.getElementById('f-ds').value=d;
}

window.addEventListener('DOMContentLoaded',init);
function logout(){localStorage.clear();if(tmr)clearInterval(tmr);window.location.href='index.html'}

async function reg(e){
  e.preventDefault();
  const l=document.getElementById('r-l').value.trim(),p=document.getElementById('r-p').value,k=keyOf(l),b=document.getElementById('r-btn');
  b.disabled=true;b.textContent='Проверка логина...';
  try{
    const c=await fetch(DB+'/users/'+k+'.json');
    if(!c.ok)throw new Error('Ошибка базы');
    const ex=await c.json();
    if(ex){alert('Этот логин уже занят! Войдите в аккаунт.');b.disabled=false;b.textContent='Зарегистрироваться и продолжить';show('b-log');return}
    const w=await fetch(DB+'/users/'+k+'.json',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({login:l,displayNick:l,discord:'',pass:p,appId:''})});
    if(!w.ok)throw new Error('Ошибка записи');
    localStorage.setItem('s_key',k);localStorage.setItem('s_nick',l);localStorage.setItem('s_login',l);localStorage.removeItem('s_app');
    window.location.href='index.html';
  }catch(err){
    alert('Ошибка подключения к базе Firebase! Проверьте интернет.');
    b.disabled=false;b.textContent='Зарегистрироваться и продолжить';
  }
}

async function log(e){
  e.preventDefault();
  const l=document.getElementById('l-l').value.trim(),p=document.getElementById('l-p').value,k=keyOf(l),b=document.getElementById('l-btn');
  b.disabled=true;b.textContent='Вход...';
  try{
    const r=await fetch(DB+'/users/'+k+'.json');
    if(!r.ok)throw new Error('Ошибка базы');
    const u=await r.json();
    if(!u||u.pass!==p){alert('Неверный логин или пароль!');b.disabled=false;b.textContent='Войти';return}
    localStorage.setItem('s_key',k);localStorage.setItem('s_nick',u.displayNick||u.login);localStorage.setItem('s_login',u.login);localStorage.setItem('s_ds',u.discord||'');
    if(u.appId)localStorage.setItem('s_app',u.appId);else localStorage.removeItem('s_app');
    window.location.href='index.html';
  }catch(err){alert('Ошибка сети');b.disabled=false;b.textContent='Войти'}
}

async function saveP(e){
  e.preventDefault();
  const k=localStorage.getItem('s_key'),n=document.getElementById('p-nick').value.trim(),d=document.getElementById('p-ds').value.trim();
  await fetch(DB+'/users/'+k+'.json',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({displayNick:n,discord:d})});
  localStorage.setItem('s_nick',n);localStorage.setItem('s_ds',d);ui();alert('Профиль обновлен!');
}

async function sendApp(e){
  e.preventDefault();
  const u=localStorage.getItem('s_nick'),l=localStorage.getItem('s_login')||u,k=localStorage.getItem('s_key'),b=document.getElementById('s-btn');
  b.disabled=true;b.textContent='Отправка...';
  const app={login:u+' ('+l+')',userKey:k,name:document.getElementById('f-name').value.trim(),age:document.getElementById('f-age').value.trim(),why:document.getElementById('f-why').value.trim(),exp:document.getElementById('f-exp').value.trim(),soft:document.getElementById('f-soft').value.trim(),discord:document.getElementById('f-ds').value.trim(),status:'wait',reviewer:''};
  try{
    const r=await fetch(DB+'/applications.json',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(app)});
    if(!r.ok)throw new Error('Ошибка отправки');
    const res=await r.json(),id=res.name;
    localStorage.setItem('s_app',id);
    await fetch(DB+'/users/'+k+'.json',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({appId:id})});
    fetch(HOOK,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:'Shell Squad',embeds:[{title:'🌿 Новая заявка на 3 ЛВЛ!',description:'[Открыть панель проверки]('+location.origin+location.pathname+'?mode=admin)',color:9055202,fields:[{name:'Игрок',value:app.login,inline:true},{name:'Имя/Возраст',value:app.name+' ('+app.age+')',inline:true},{name:'Discord',value:app.discord,inline:true},{name:'Опыт',value:app.exp,inline:true},{name:'Чит',value:app.soft,inline:true},{name:'Почему он',value:app.why}]}]})}).catch(()=>{});
    window.location.href='index.html';
  }catch(err){
    alert('Ошибка отправки! Проверьте интернет.');
    b.disabled=false;b.textContent='Отправить заявку';
  }
}

function watch(id){once(id);if(tmr)clearInterval(tmr);tmr=setInterval(()=>once(id),4000)}
async function once(id){
  try{
    const r=await fetch(DB+'/applications/'+id+'.json'),d=await r.json();if(!d)return;
    const cls=d.status==='review'?'st-review':d.status==='accept'?'st-accept':d.status==='reject'?'st-reject':'st-wait';
    const bTxt=d.status==='review'?'👀 Взято на рассмотрение':d.status==='accept'?'✅ Вы взяты!':d.status==='reject'?'❌ Вы отклонены':'⏳ Ожидает рассмотрения';
    const mTxt=d.status==='review'?'Администратор проверяет вашу анкету.':d.status==='accept'?'Поздравляем! С вами свяжутся в ДС, ждите.':d.status==='reject'?'Ваша заявка отклонена. С вами свяжутся в ДС при необходимости, ждите.':'Ваша анкета отправлена. Ожидайте.';
    const rTxt=d.reviewer?(d.status==='review'?'Взял: <b>'+d.reviewer+'</b>':'Рассмотрел: <b>'+d.reviewer+'</b>'):'';

    ['st-badge','p-badge'].forEach(el=>{const x=document.getElementById(el);if(x){x.className='badge '+cls;x.textContent=bTxt}});
    ['st-txt','p-st-txt'].forEach(el=>{const x=document.getElementById(el);if(x)x.textContent=mTxt});
    ['st-rev','p-st-rev'].forEach(el=>{const x=document.getElementById(el);if(x)x.innerHTML=rTxt});
  }catch(e){}
}

function admLog(e){
  e.preventDefault();
  if(document.getElementById('a-pass').value!==PASS){alert('Неверный пароль!');return}
  const n=document.getElementById('a-nick').value.trim();
  localStorage.setItem('s_adm',n);document.getElementById('a-cur').textContent=n;
  document.getElementById('adm-f').classList.add('hidden');document.getElementById('adm-box').classList.remove('hidden');loadAdm();
}

async function loadAdm(){
  const l=document.getElementById('a-list');l.innerHTML='Загрузка...';
  const r=await fetch(DB+'/applications.json'),d=await r.json();
  if(!d){l.innerHTML='Заявок нет.';return}
  l.innerHTML='';
  for(const[id,a]of Object.entries(d).reverse()){
    let st='⏳ Ожидает';
    if(a.status==='review')st='👀 На рассмотрении ('+a.reviewer+')';
    if(a.status==='accept')st='✅ Взят ('+a.reviewer+')';
    if(a.status==='reject')st='❌ Отклонен ('+a.reviewer+')';
    l.innerHTML+='<div class="item"><div style="display:flex;justify-content:space-between;margin-bottom:8px"><strong>'+a.login+' ('+a.name+', '+a.age+')</strong><span style="color:#c4b5fd">'+st+'</span></div><p>Discord: '+a.discord+' | Опыт: '+a.exp+' | Чит: '+a.soft+'</p><p>'+a.why+'</p><div class="acts"><button class="abtn" style="background:#3b82f6" onclick="setA(\''+id+'\',\'review\')">👀 Взять на рассмотрение</button><button class="abtn" style="background:#10b981" onclick="setA(\''+id+'\',\'accept\')">✅ Взять</button><button class="abtn" style="background:#ef4444" onclick="setA(\''+id+'\',\'reject\')">❌ Отклонить</button></div></div>';
  }
}

async function setA(id,status){
  await fetch(DB+'/applications/'+id+'.json',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status,reviewer:localStorage.getItem('s_adm')||'Админ'})});
  loadAdm();
}
</script>
</body>
</html>
